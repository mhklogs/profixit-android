name: Build ProFixit APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create mobile env
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY"
            echo "EXPO_PUBLIC_API_URL=$EXPO_PUBLIC_API_URL"
          } > .env
          echo ".env created:"
          sed -E 's/(ANON_KEY=).{8}.*/\1REDACTED/' .env

      - name: Prebuild Android project
        env:
          CI: 'true'
        run: yes | npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        env:
          CI: 'true'
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: profixit-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  publish-release:
    # Only on manual dispatch: this republishes the release asset that the
    # website's download buttons point at, so a normal push must not trigger it.
    if: github.event_name == 'workflow_dispatch'
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REPO: ${{ github.repository }}
    steps:
      # gh resolves the target repo from the git remote, so a checkout is
      # required even though no source files are needed here.
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: profixit-apk
          path: dist

      - name: Publish APK to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.0
        run: |
          set -euo pipefail
          src="dist/app-release.apk"
          # The website links to releases/latest/download/ProFixit.apk,
          # so the asset must carry that name, not the gradle default.
          out="dist/ProFixit.apk"
          cp "$src" "$out"
          test -f "$src" || { echo "missing $src"; exit 1; }
          echo "APK size: $(stat -c%s "$src") bytes"

          # A ~100 MB upload can drop mid-transfer, so retry rather than fail.
          uploaded=0
          for attempt in 1 2 3; do
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "attempt $attempt: release $TAG exists, refreshing asset"
              if gh release upload "$TAG" "$out" --clobber --repo "$REPO"; then
                uploaded=1; break
              fi
            else
              echo "attempt $attempt: creating release $TAG"
              if gh release create "$TAG" "$out" \
                   --title "ProFixit $TAG" \
                   --notes "Contractor Android app. Built automatically by CI." \
                   --repo "$REPO"; then
                uploaded=1; break
              fi
            fi
            echo "attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          test "$uploaded" -eq 1 || { echo "could not publish the APK"; exit 1; }
          gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '.assets[] | "  asset: \(.name) \(.size) bytes"'
